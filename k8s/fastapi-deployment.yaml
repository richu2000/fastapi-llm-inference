
apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
        - name: fastapi
          image: fastapi-llm-api:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: OLLAMA_URL
              value: "http://ollama-service:11434/api/generate"

